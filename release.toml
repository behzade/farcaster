publish = false
push = true
tag = true
verify = true

tag-name = "v{{version}}"
tag-message = "Farcaster v{{version}}"
pre-release-commit-message = "chore(release): prepare v{{version}}"
allow-branch = ["main"]

pre-release-replacements = [
  { file = "packaging/linux.toml", exactly = 1, search = '^version = "[^"]+"$', replace = 'version = "{{version}}"' },
]
