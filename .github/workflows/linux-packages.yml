name: Linux packages

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BUILD_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Test Linux packaging logic
        run: |
          python3 scripts/package-deb_tests.py
          python3 scripts/package-appimage_tests.py

      - name: Install Linux build dependencies
        run: |
          # Zig 0.16's C++ headers require libc++ 21 or newer.
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/apt.llvm.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake desktop-file-utils dpkg-dev libc++-21-dev libc++abi-21-dev \
            libasound2-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libfuse2 libvulkan-dev \
            libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxml2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version" >&2
            exit 1
          }

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy' | sha256sum --check
          chmod 755 linuxdeploy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: make bundle BUNDLE_FORMATS=appimage

      - name: Stage release asset
        shell: bash
        run: |
          file target/release/farcaster | grep -q 'ELF 64-bit.*x86-64'
          mkdir -p dist
          appimage=$(find target/release -maxdepth 1 -type f -iname '*farcaster*.AppImage' -print -quit)
          test -n "$appimage"
          install -m755 "$appimage" "dist/Farcaster-${BUILD_LABEL}-x86_64.AppImage"

      - name: Package Debian binary
        run: bash scripts/package-deb.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error

  linux-startup:
    name: AppImage startup
    needs: linux
    uses: ./.github/workflows/appimage-startup.yml
    with:
      artifact: release-linux-x86_64

  debian:
    name: Install / ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist
      - name: Install through apt and check the dependency closure
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/*.deb
          ldd /usr/lib/farcaster/farcaster | tee dependencies.log
          if grep -q 'not found' dependencies.log; then exit 1; fi
          test -f /usr/share/applications/io.github.behzade.farcaster.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.behzade.farcaster.png
      - name: Install only desktop and diagnostic tools
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            weston libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            fonts-dejavu-core dbus binutils file xvfb desktop-file-utils
          # Ubuntu 22.04 supplies weston-info with Weston instead.
          if [ "${{ matrix.image }}" != ubuntu:22.04 ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wayland-utils
          fi
          desktop-file-validate /usr/share/applications/io.github.behzade.farcaster.desktop
          useradd --create-home tester
          install -d -o tester -g tester /tmp/probe-logs
      - name: Launch the installed package as a normal user
        run: |
          install -m755 scripts/probe-native-startup.sh /tmp/probe-native-startup.sh
          install -m644 scripts/probe-wayland.sh /tmp/probe-wayland.sh
          su - tester -c 'dbus-run-session -- bash /tmp/probe-native-startup.sh /usr/bin/farcaster /tmp/probe-logs'
      - name: Verify removal
        run: |
          apt-get remove -y farcaster
          test ! -e /usr/bin/farcaster
          test ! -e /usr/lib/farcaster/farcaster
          test ! -e /usr/share/applications/io.github.behzade.farcaster.desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-deb-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: /tmp/probe-logs
          if-no-files-found: warn

  native-packages:
    name: Native Arch and Nix packages
    uses: ./.github/workflows/native-packages.yml
