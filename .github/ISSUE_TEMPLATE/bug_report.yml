name: Bug report
description: Report a problem in Farcaster
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, use the private report link in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Farcaster version
      placeholder: v0.3.5
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 15 or Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or other details
      description: Remove secrets before posting.
