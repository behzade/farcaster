[package]
name = "farcaster"
version = "0.4.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Native desktop client for coding agents"

[package.metadata.packager]
product-name = "Farcaster"
identifier = "io.github.behzade.farcaster"
category = "DeveloperTool"
license-file = "LICENSE"
icons = [
    "assets/icons/app/Farcaster.icns",
    "assets/icons/app/icon_16x16.png",
    "assets/icons/app/icon_32x32.png",
    "assets/icons/app/icon_128x128.png",
    "assets/icons/app/icon_256x256.png",
    "assets/icons/app/icon_512x512.png",
    "assets/icons/app/icon_512x512@2x.png",
]
resources = [
    "LICENSE",
    "NOTICE.md",
    "THIRD_PARTY_LICENSES",
    { src = "assets/ibm-plex-sans/OFL.txt", target = "THIRD_PARTY_LICENSES/IBM-PLEX-OFL.txt" },
    { src = "assets/lilex/OFL.txt", target = "THIRD_PARTY_LICENSES/LILEX-OFL.txt" },
    { src = "assets/vazirmatn/OFL.txt", target = "THIRD_PARTY_LICENSES/VAZIRMATN-OFL.txt" },
]
binaries = [{ path = "farcaster", main = true }]
before-packaging-command = "cargo build --release --locked --bin farcaster"

[package.metadata.packager.macos]
minimum-system-version = "14.0"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
farcaster-contracts = { path = "crates/contracts" }
farcaster-access = { path = "crates/access" }
farcaster-agent-protocol = { path = "crates/agent-protocol" }
farcaster-agents = { path = "crates/agents" }
farcaster-conversation = { path = "crates/conversation" }
farcaster-editors = { path = "crates/editors" }
farcaster-mcp-server = { path = "crates/mcp-server" }
farcaster-projects = { path = "crates/projects" }
farcaster-repository = { path = "crates/repository" }
farcaster-reviews = { path = "crates/reviews" }
farcaster-runtime = { path = "crates/runtime" }
farcaster-sessions = { path = "crates/sessions" }
farcaster-storage = { path = "crates/storage" }
farcaster-utility = { path = "crates/utility" }
futures = "0.3.32"
gpui = { package = "gpui-kit", version = "=0.7.0", default-features = false, features = ["component", "profiler"] }
gpui-base = "=0.7.0"
gpui-component = "=0.7.0"
gpui-libghostty = "0.3.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
notify = "7.0.0"
nucleo-matcher = "0.3.1"
path-clean = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sum_tree = { package = "gpui-pre-sum-tree", version = "=0.3.7" }
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "parsing"] }
toml = "1.1.3"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
workgraph = { path = "workgraph" }
zlog = { package = "gpui-pre-zlog", version = "=0.3.7" }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["UNUserNotificationCenter", "block2"] }

[dev-dependencies]
farcaster-agents = { path = "crates/agents", features = ["test-support"] }
farcaster-conversation = { path = "crates/conversation", features = ["test-support"] }
farcaster-sessions = { path = "crates/sessions", features = ["test-support"] }
farcaster-storage = { path = "crates/storage", features = ["test-support"] }
farcaster-mcp-server = { path = "crates/mcp-server", features = ["test-support"] }
farcaster-runtime = { path = "crates/runtime", features = ["test-support"] }
gpui = { package = "gpui-kit", version = "=0.7.0", default-features = false, features = ["component", "test-support"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"

[[bench]]
name = "transcript"
harness = false

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package."gpui-base"]
opt-level = 3

[profile.dev.package."gpui-component"]
opt-level = 3

[profile.dev.package.gpui-pre-macos]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package."gpui-libghostty"]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package."cosmic-text"]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
