[package]
name = "farcaster"
version = "0.3.7"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Native desktop client for coding agents"

[package.metadata.packager]
product-name = "Farcaster"
identifier = "io.github.behzade.farcaster"
category = "DeveloperTool"
license-file = "LICENSE"
icons = [
    "assets/icons/app/Farcaster.icns",
    "assets/icons/app/icon_16x16.png",
    "assets/icons/app/icon_32x32.png",
    "assets/icons/app/icon_128x128.png",
    "assets/icons/app/icon_256x256.png",
    "assets/icons/app/icon_512x512.png",
    "assets/icons/app/icon_512x512@2x.png",
]
resources = [
    "LICENSE",
    "NOTICE.md",
    "THIRD_PARTY_LICENSES",
    { src = "assets/ibm-plex-sans/OFL.txt", target = "THIRD_PARTY_LICENSES/IBM-PLEX-OFL.txt" },
    { src = "assets/lilex/OFL.txt", target = "THIRD_PARTY_LICENSES/LILEX-OFL.txt" },
    { src = "assets/vazirmatn/OFL.txt", target = "THIRD_PARTY_LICENSES/VAZIRMATN-OFL.txt" },
    { src = "third_party/gpui-component-bd83329/LICENSE-APACHE", target = "THIRD_PARTY_LICENSES/GPUI-COMPONENT-APACHE-2.0.txt" },
    { src = "third_party/zed-gpui-cc053a4/LICENSE-APACHE", target = "THIRD_PARTY_LICENSES/ZED-GPUI-APACHE-2.0.txt" },
    { src = "third_party/zed-gpui-cc053a4/LICENSE-GPL", target = "THIRD_PARTY_LICENSES/ZED-GPUI-GPL-3.0.txt" },
]
binaries = [{ path = "farcaster", main = true }]
before-packaging-command = "cargo build --release --locked --bin farcaster"

[package.metadata.packager.macos]
minimum-system-version = "14.0"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
farcaster-contracts = { path = "crates/contracts" }
farcaster-access = { path = "crates/access" }
farcaster-agent-protocol = { path = "crates/agent-protocol" }
farcaster-agents = { path = "crates/agents" }
farcaster-conversation = { path = "crates/conversation" }
farcaster-editors = { path = "crates/editors" }
farcaster-mcp-server = { path = "crates/mcp-server" }
farcaster-projects = { path = "crates/projects" }
farcaster-repository = { path = "crates/repository" }
farcaster-reviews = { path = "crates/reviews" }
farcaster-runtime = { path = "crates/runtime" }
farcaster-sessions = { path = "crates/sessions" }
farcaster-storage = { path = "crates/storage" }
farcaster-utility = { path = "crates/utility" }
futures = "0.3.32"
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui", features = ["profiler"] }
gpui-base = { path = "third_party/gpui-component-bd83329/base" }
gpui-component = { path = "third_party/gpui-component-bd83329/ui" }
gpui-libghostty = "0.3.0"
gpui_platform = { path = "third_party/zed-gpui-cc053a4/crates/gpui_platform", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
notify = "7.0.0"
nucleo-matcher = "0.3.1"
path-clean = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sum_tree = { path = "third_party/zed-gpui-cc053a4/crates/sum_tree" }
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "parsing"] }
toml = "1.1.3"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
workgraph = { path = "workgraph" }
zlog = { path = "third_party/zed-gpui-cc053a4/crates/zlog" }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
farcaster-agents = { path = "crates/agents", features = ["test-support"] }
farcaster-conversation = { path = "crates/conversation", features = ["test-support"] }
farcaster-sessions = { path = "crates/sessions", features = ["test-support"] }
farcaster-storage = { path = "crates/storage", features = ["test-support"] }
farcaster-mcp-server = { path = "crates/mcp-server", features = ["test-support"] }
farcaster-runtime = { path = "crates/runtime", features = ["test-support"] }
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui", features = ["test-support"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"

[[bench]]
name = "transcript"
harness = false

[patch.crates-io]
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui" }

[patch."https://github.com/zed-industries/zed"]
collections = { path = "third_party/zed-gpui-cc053a4/crates/collections" }
derive_refineable = { path = "third_party/zed-gpui-cc053a4/crates/refineable/derive_refineable" }
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui" }
gpui_linux = { path = "third_party/zed-gpui-cc053a4/crates/gpui_linux" }
gpui_macos = { path = "third_party/zed-gpui-cc053a4/crates/gpui_macos" }
gpui_macros = { path = "third_party/zed-gpui-cc053a4/crates/gpui_macros" }
gpui_platform = { path = "third_party/zed-gpui-cc053a4/crates/gpui_platform" }
gpui_shared_string = { path = "third_party/zed-gpui-cc053a4/crates/gpui_shared_string" }
gpui_util = { path = "third_party/zed-gpui-cc053a4/crates/gpui_util" }
gpui_web = { path = "third_party/zed-gpui-cc053a4/crates/gpui_web" }
gpui_wgpu = { path = "third_party/zed-gpui-cc053a4/crates/gpui_wgpu" }
gpui_windows = { path = "third_party/zed-gpui-cc053a4/crates/gpui_windows" }
http_client = { path = "third_party/zed-gpui-cc053a4/crates/http_client" }
media = { path = "third_party/zed-gpui-cc053a4/crates/media" }
perf = { path = "third_party/zed-gpui-cc053a4/tooling/perf" }
refineable = { path = "third_party/zed-gpui-cc053a4/crates/refineable" }
scheduler = { path = "third_party/zed-gpui-cc053a4/crates/scheduler" }
sum_tree = { path = "third_party/zed-gpui-cc053a4/crates/sum_tree" }
util_macros = { path = "third_party/zed-gpui-cc053a4/crates/util_macros" }
zlog = { path = "third_party/zed-gpui-cc053a4/crates/zlog" }
ztracing = { path = "third_party/zed-gpui-cc053a4/crates/ztracing" }
ztracing_macro = { path = "third_party/zed-gpui-cc053a4/crates/ztracing_macro" }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package."gpui-base"]
opt-level = 3

[profile.dev.package."gpui-component"]
opt-level = 3

[profile.dev.package.gpui_macos]
opt-level = 3

[profile.dev.package.gpui_platform]
opt-level = 3

[profile.dev.package."gpui-libghostty"]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package."cosmic-text"]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
