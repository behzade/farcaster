[package]
name = "pi-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Native GPUI client for Pi RPC"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui", features = ["profiler"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bd833291311289f3468479d31b629d3de279d3d4", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bd833291311289f3468479d31b629d3de279d3d4" }
gpui-fps = { git = "https://github.com/longbridge/gpui-component", rev = "bd833291311289f3468479d31b629d3de279d3d4" }
gpui_platform = { path = "third_party/zed-gpui-cc053a4/crates/gpui_platform", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
ropey = "=2.0.0-beta.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
workgraph = { path = "workgraph" }
zlog = { path = "third_party/zed-gpui-cc053a4/crates/zlog" }

[dev-dependencies]
tempfile = "3.27.0"

[patch."https://github.com/zed-industries/zed"]
collections = { path = "third_party/zed-gpui-cc053a4/crates/collections" }
derive_refineable = { path = "third_party/zed-gpui-cc053a4/crates/refineable/derive_refineable" }
gpui = { path = "third_party/zed-gpui-cc053a4/crates/gpui" }
gpui_linux = { path = "third_party/zed-gpui-cc053a4/crates/gpui_linux" }
gpui_macos = { path = "third_party/zed-gpui-cc053a4/crates/gpui_macos" }
gpui_macros = { path = "third_party/zed-gpui-cc053a4/crates/gpui_macros" }
gpui_platform = { path = "third_party/zed-gpui-cc053a4/crates/gpui_platform" }
gpui_shared_string = { path = "third_party/zed-gpui-cc053a4/crates/gpui_shared_string" }
gpui_util = { path = "third_party/zed-gpui-cc053a4/crates/gpui_util" }
gpui_web = { path = "third_party/zed-gpui-cc053a4/crates/gpui_web" }
gpui_wgpu = { path = "third_party/zed-gpui-cc053a4/crates/gpui_wgpu" }
gpui_windows = { path = "third_party/zed-gpui-cc053a4/crates/gpui_windows" }
http_client = { path = "third_party/zed-gpui-cc053a4/crates/http_client" }
media = { path = "third_party/zed-gpui-cc053a4/crates/media" }
perf = { path = "third_party/zed-gpui-cc053a4/tooling/perf" }
refineable = { path = "third_party/zed-gpui-cc053a4/crates/refineable" }
scheduler = { path = "third_party/zed-gpui-cc053a4/crates/scheduler" }
sum_tree = { path = "third_party/zed-gpui-cc053a4/crates/sum_tree" }
util_macros = { path = "third_party/zed-gpui-cc053a4/crates/util_macros" }
zlog = { path = "third_party/zed-gpui-cc053a4/crates/zlog" }
ztracing = { path = "third_party/zed-gpui-cc053a4/crates/ztracing" }
ztracing_macro = { path = "third_party/zed-gpui-cc053a4/crates/ztracing_macro" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
