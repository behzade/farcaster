[package]
name = "gpui-base"
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false
test = false

[features]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1.3"
gpui = { path = "../../zed-gpui-cc053a4/crates/gpui" }
gpui_macros = { path = "../../zed-gpui-cc053a4/crates/gpui_macros" }
instant = { version = "0.1", features = ["wasm-bindgen"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
regex = "1"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
tracing = "0.1"
unicode-segmentation = "1.12.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSString"] }
