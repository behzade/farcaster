[package]
name = "gpui-neovim"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Embedded Neovim component for GPUI, rendered by libghostty"
repository = "https://github.com/behzade/gpui-libghostty"

[dependencies]
gpui = "0.2.2"
gpui-ghostty = { package = "gpui-libghostty", version = "0.1.0" }
wait-timeout = "0.2.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
