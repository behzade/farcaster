[package]
name = "pi-sandbox-broker"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22.1"
nix = { version = "0.31.3", features = ["poll", "process", "signal"] }
regex-lite = "0.1.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
