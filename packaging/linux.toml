name = "farcaster"
product-name = "Farcaster"
version = "0.1.0"
identifier = "io.github.behzade.farcaster"
category = "DeveloperTool"
description = "Native desktop client for coding agents"
license-file = "../LICENSE"
icons = [
    "../assets/icons/app/icon_16x16.png",
    "../assets/icons/app/icon_32x32.png",
    "../assets/icons/app/icon_128x128.png",
    "../assets/icons/app/icon_256x256.png",
    "../assets/icons/app/icon_512x512.png",
    "../assets/icons/app/icon_512x512@2x.png",
]
resources = [
    "../LICENSE",
    "../NOTICE.md",
    "../THIRD_PARTY_LICENSES",
    { src = "../assets/lilex/OFL.txt", target = "THIRD_PARTY_LICENSES/LILEX-OFL.txt" },
    { src = "../assets/vazirmatn/OFL.txt", target = "THIRD_PARTY_LICENSES/VAZIRMATN-OFL.txt" },
    { src = "../third_party/gpui-component-bd83329/LICENSE-APACHE", target = "THIRD_PARTY_LICENSES/GPUI-COMPONENT-APACHE-2.0.txt" },
    { src = "../third_party/zed-gpui-cc053a4/LICENSE-APACHE", target = "THIRD_PARTY_LICENSES/ZED-GPUI-APACHE-2.0.txt" },
    { src = "../third_party/zed-gpui-cc053a4/LICENSE-GPL", target = "THIRD_PARTY_LICENSES/ZED-GPUI-GPL-3.0.txt" },
]
# cargo-packager derives the desktop ID with Path::file_stem. The trailing dot
# keeps the final `.farcaster` segment in that stem; the normal launcher below
# is the executable referenced by the generated desktop entry.
binaries = [
    { path = "io.github.behzade.farcaster.", main = true },
    { path = "io.github.behzade.farcaster" },
    { path = "farcaster" },
]
