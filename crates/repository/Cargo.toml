[package]
name = "farcaster-repository"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
async-channel = "2.5.0"
notify = "7.0.0"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
