[package]
name = "farcaster-reviews"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
farcaster-conversation = { path = "../conversation" }
farcaster-utility = { path = "../utility" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zlog = { path = "../../third_party/zed-gpui-cc053a4/crates/zlog" }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
