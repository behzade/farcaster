[package]
name = "farcaster-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
farcaster-access = { path = "../access" }
farcaster-agent-protocol = { path = "../agent-protocol" }
farcaster-agents = { path = "../agents" }
farcaster-projects = { path = "../projects" }
farcaster-repository = { path = "../repository" }
farcaster-sessions = { path = "../sessions" }
log = "0.4.16"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
