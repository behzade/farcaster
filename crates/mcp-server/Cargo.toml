[package]
name = "farcaster-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[features]
test-support = []

[dependencies]
async-channel = "2.5.0"
axum = "0.8.8"
farcaster-agent-protocol = { path = "../agent-protocol" }
farcaster-agents = { path = "../agents" }
farcaster-reviews = { path = "../reviews" }
farcaster-sessions = { path = "../sessions" }
farcaster-storage = { path = "../storage" }
log = "0.4.16"
path-clean = "1.0.1"
rmcp = { version = "3.1.4", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["net", "rt-multi-thread"] }
uuid = { version = "1.24.0", features = ["v4"] }
workgraph = { path = "../../workgraph" }

[dev-dependencies]
farcaster-agents = { path = "../agents", features = ["test-support"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
