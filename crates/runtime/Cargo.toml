[package]
name = "farcaster-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[features]
test-support = ["farcaster-agents/test-support", "farcaster-storage/test-support"]

[dependencies]
async-channel = "2.5.0"
farcaster-agent-protocol = { path = "../agent-protocol" }
farcaster-agents = { path = "../agents" }
farcaster-conversation = { path = "../conversation" }
farcaster-reviews = { path = "../reviews" }
farcaster-sessions = { path = "../sessions" }
farcaster-storage = { path = "../storage" }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
zlog = { path = "../../third_party/zed-gpui-cc053a4/crates/zlog" }

[dev-dependencies]
farcaster-agents = { path = "../agents", features = ["test-support"] }
farcaster-conversation = { path = "../conversation", features = ["test-support"] }
farcaster-mcp-server = { path = "../mcp-server", features = ["test-support"] }
farcaster-storage = { path = "../storage", features = ["test-support"] }
farcaster-sessions = { path = "../sessions", features = ["test-support"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
