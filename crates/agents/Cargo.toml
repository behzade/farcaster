[package]
name = "farcaster-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
agent-client-protocol = "2.1.0"
async-channel = "2.5.0"
base64 = "0.22.1"
blocking = "1.6.2"
claude-sdk-types = { path = "../claude-sdk-types", features = ["cli-compat"] }
farcaster-access = { path = "../access" }
farcaster-agent-protocol = { path = "../agent-protocol" }
farcaster-contracts = { path = "../contracts" }
farcaster-projects = { path = "../projects" }
farcaster-sessions = { path = "../sessions" }
futures = "0.3.32"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "parsing"] }
toml = "1.1.3"
tpt-logfmt-parse = "0.3.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
zlog = { path = "../../third_party/zed-gpui-cc053a4/crates/zlog" }

[dev-dependencies]
farcaster-conversation = { path = "../conversation" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"
